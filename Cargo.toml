[package]
name = "pm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91.0"

[[bin]]
name = "p"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
directories = "6.0.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
skim = "5.9.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
uuid = { version = "1.23.2", features = ["v4"] }
walkdir = "2.5.0"
